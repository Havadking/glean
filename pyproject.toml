[project]
name = "video-summarizer"
version = "0.1.0"
description = "视频转写总结工具：URL -> 字幕/ASR -> 结构化转写 -> LLM 总结"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "openai>=1.60.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# GPU 推理需要的 CUDA 运行库（ctranslate2 依赖 cuBLAS + cuDNN 9）。
# 装在 venv 里，不污染系统，也不落 C 盘。
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]
# Web 界面（`vsum ui`）。只用命令行的话不需要装。
ui = [
    "gradio>=5.0",
]
# FunASR：中文内容的默认 ASR。要拉 torch，装完约 3GB。
funasr = [
    "funasr>=1.2.0",
    "modelscope>=1.20",
    "soundfile>=0.12.1",   # 直接用它读切片，不只靠 funasr 传递依赖
    "torch>=2.9",
    "torchaudio>=2.9",
]

# PyPI 上的 Windows torch 轮子是纯 CPU 版（118MB），CUDA 版只在 pytorch 官方源上。
# 这里把 win32 平台的 torch 指到 cu130，其他平台走默认源。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
vsum = "video_summarizer.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_summarizer"]
