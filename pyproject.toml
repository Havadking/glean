[project]
name = "video-summarizer"
version = "0.1.0"
description = "视频转写总结工具：URL -> 字幕/ASR -> 结构化转写 -> LLM 总结"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "openai>=1.60.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# GPU 推理需要的 CUDA 运行库（ctranslate2 依赖 cuBLAS + cuDNN 9）。
# 装在 venv 里，不污染系统，也不落 C 盘。
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]
# Web 界面（`vsum ui`）。只用命令行的话不需要装。
ui = [
    "gradio>=5.0",
]

[project.scripts]
vsum = "video_summarizer.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_summarizer"]
