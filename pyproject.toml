[project]
name = "video-summarizer"
version = "1.0"
description = "拾光笺 / Glean：视频链接 -> 字幕或本地 ASR -> 结构化转写 -> LLM 总结、思维导图、可追问的本地视频库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "openai>=1.60.0",       # OpenAI 兼容接口（DeepSeek / 通义 / Kimi ...）
    "anthropic>=1.0.0",     # Claude 原生接口
    "httpx>=0.27",          # Ollama 原生接口
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# GPU 推理需要的 CUDA 运行库（ctranslate2 依赖 cuBLAS + cuDNN 9）。
# 装在 venv 里，不污染系统，也不落 C 盘。
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]
# Web 界面（`vsum ui`）。只用命令行的话不需要装。
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# FunASR：中文内容的默认 ASR。要拉 torch，装完约 3GB。
funasr = [
    "funasr>=1.2.0",
    "modelscope>=1.20",
    "soundfile>=0.12.1",   # 直接用它读切片，不只靠 funasr 传递依赖
    "torch>=2.9",
    "torchaudio>=2.9",
]
# 抖音 cookie 自动刷新：用本机已装的 Chrome/Edge 无头访问一次抖音拿新 cookie。
# 只装 Python 包，不需要 `playwright install` 下载浏览器内核。
cookies = [
    "playwright>=1.45",
]
# 测试。跑 `uv run pytest`。
dev = [
    "pytest>=8.0",
]

# PyPI 上的 Windows torch 轮子是纯 CPU 版（118MB），CUDA 版只在 pytorch 官方源上。
# 这里把 win32 平台的 torch 指到 cu130，其他平台走默认源。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
vsum = "video_summarizer.cli:cli_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑不碰网络、不加载模型的那些，几秒就完
addopts = "-q -m 'not slow'"
markers = ["slow: 需要真实模型或网络，默认不跑（用 -m slow 单独跑）"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_summarizer"]
